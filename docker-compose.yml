# Arte & Pintura — produção no VPS Hostinger (Docker + Traefik)
# Imagem: clebertsfigueiredo/arte-e-pintura:latest
# Domínio: arteepinturapetrolina.com.br → A para o IP do VPS

services:
  web:
    image: clebertsfigueiredo/arte-e-pintura:latest
    container_name: arte-e-pintura
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.artepintura.rule=Host(`arteepinturapetrolina.com.br`) || Host(`www.arteepinturapetrolina.com.br`)
      - traefik.http.routers.artepintura.entrypoints=websecure
      - traefik.http.routers.artepintura.tls.certresolver=letsencrypt
      - traefik.http.services.artepintura.loadbalancer.server.port=80
